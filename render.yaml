services:
  - type: web
    name: gndec-cse-labguard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
